<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Whose Track?</title>
<meta name="description" content="A music party game for friends: a song plays and everyone guesses whose it is.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1a226b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 44'%3E%3Crect x='2' y='2' width='60' height='40' rx='6' fill='%23ffcf3f' stroke='%231c1d2e' stroke-width='3'/%3E%3Crect x='12' y='12' width='40' height='14' rx='7' fill='%231c1d2e'/%3E%3Ccircle cx='21' cy='19' r='4' fill='%23f4f1e6'/%3E%3Ccircle cx='43' cy='19' r='4' fill='%23f4f1e6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Kalam:wght@400;700&family=Martian+Mono:wght@500;700&family=Rethink+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: a cobalt desk; every panel is a cassette J-card insert, each player is a coloured tape stripe */
:root{
  --desk:#1a226b;
  --desk-deep:#11174d;
  --desk-edge:#2f3a9c;
  --shell:#0e1342;
  --paper:#f4f1e6;
  --paper-shade:#e7e2d2;
  --field:#fffdf7;
  --rule:#cbd3ee;
  --ink:#1c1d2e;
  --ink-soft:#5d6078;
  --on-desk:#eef0ff;
  --on-desk-soft:#aab1e8;
  --accent:#ffcf3f;
  --ok:#0f9d63;
  --bad:#d93a54;
  --focus:#5cc8ff;
  --font-display:"Bowlby One","Arial Black",Impact,sans-serif;
  --font-hand:"Kalam","Segoe Print","Comic Sans MS",cursive;
  --font-body:"Rethink Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"Martian Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --radius:10px;
  --me:#ffcf3f;
  --spotify:#1ed760;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100vh;min-height:100dvh;
  background-color:var(--desk);
  background-image:
    radial-gradient(900px 520px at 88% -12%, rgba(98,116,255,.38), transparent 62%),
    radial-gradient(rgba(255,255,255,.055) 1px, transparent 1.2px);
  background-size:auto,22px 22px;
  background-attachment:fixed;
  color:var(--on-desk);
  font:16px/1.5 var(--font-body);
  -webkit-font-smoothing:antialiased;
}
[hidden]{display:none!important}
img{max-width:100%}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:700}
p{margin:0}
button{font:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

.wrap{
  max-width:680px;margin:0 auto;
  padding-block:calc(env(safe-area-inset-top,0px) + 18px) calc(env(safe-area-inset-bottom,0px) + 56px);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}

/* ---------- shared pieces ---------- */
.logo{display:inline-flex;align-items:center;gap:10px;font-family:var(--font-display);font-size:22px;line-height:1;color:var(--paper);text-decoration:none;white-space:nowrap}
.logo b{color:var(--accent);font-weight:400}
.logo svg{width:34px;height:auto;flex:none}

.card{color-scheme:light;background:var(--paper);color:var(--ink);border-radius:var(--radius);box-shadow:0 3px 0 var(--desk-deep),0 14px 34px rgba(4,7,40,.38);padding:18px;min-width:0}
.card h2{font-size:18px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.card h2 small{font:500 13px/1 var(--font-mono);color:var(--ink-soft)}
.stripe{height:11px;margin:-18px -18px 16px;border-radius:var(--radius) var(--radius) 0 0;background:linear-gradient(to bottom,var(--c,var(--accent)) 0 5px,var(--paper) 5px 7px,var(--c,var(--accent)) 7px 11px)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font:700 15px/1.1 var(--font-body);padding:12px 18px;border-radius:8px;
  border:2px solid var(--ink);background:var(--paper);color:var(--ink);
  box-shadow:0 3px 0 var(--ink);cursor:pointer;transition:transform .06s,box-shadow .06s;
  text-decoration:none;
}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--accent)}
.btn.big{font-size:17px;padding:15px 22px;width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--on-desk);border-color:var(--on-desk-soft);box-shadow:none}
.card .btn.ghost{color:var(--ink);border-color:var(--ink-soft)}
.btn.small{padding:8px 12px;font-size:14px}
.linkbtn{background:none;border:0;padding:4px 0;color:var(--ink-soft);text-decoration:underline;cursor:pointer;font-size:14px}

.field{display:grid;gap:6px}
.field label,.lbl{font:700 12px/1.2 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
input[type=text],textarea,select{
  width:100%;font:500 16px/1.4 var(--font-body);color:var(--ink);background:var(--field);
  border:2px solid var(--ink);border-radius:8px;padding:11px 13px;
}
select{padding-block:9px;cursor:pointer}
select:disabled{opacity:.75;cursor:default}
textarea{resize:vertical;min-height:84px;font-size:14px}
input::placeholder,textarea::placeholder{color:var(--ink-soft);opacity:.8}

.dot{width:12px;height:12px;border-radius:50%;background:var(--c);border:2px solid var(--ink);flex:none}
.tag{font:700 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;background:var(--ink);color:var(--paper);padding:4px 6px;border-radius:4px;vertical-align:2px}
.hand{font-family:var(--font-hand);font-weight:700}
.muted{color:var(--ink-soft)}
.msg{min-height:1.5em;font-size:14px}
.msg.err{color:var(--bad);font-weight:700}

/* ---------- home ---------- */
.home{display:grid;grid-template-columns:minmax(0,1fr);gap:28px;align-items:start;padding-block:3vh 0}
.hero h1{font-family:var(--font-display);font-weight:400;font-size:clamp(54px,9.5vw,112px);line-height:.9;color:var(--paper);letter-spacing:.005em}
.hero h1 span{display:block;color:var(--accent)}
.tagline{font-size:clamp(18px,2.3vw,22px);max-width:32ch;margin:18px 0 28px;color:var(--on-desk)}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:14px;max-width:48ch;counter-reset:s}
.steps li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:start;color:var(--on-desk-soft)}
.steps li b{color:var(--on-desk);font-weight:700}
.steps li::before{counter-increment:s;content:counter(s);font:700 14px/30px var(--font-mono);text-align:center;width:30px;height:30px;border-radius:50%;border:2px solid var(--on-desk-soft);color:var(--on-desk)}
.entry{display:grid;gap:16px}
.entry .or{display:flex;align-items:center;gap:10px;font:700 12px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.entry .or::before,.entry .or::after{content:"";flex:1;height:2px;background:var(--rule)}
.joinrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}
#code-input{font:700 20px/1.2 var(--font-mono);letter-spacing:.2em;text-transform:uppercase}
.fineprint{margin-top:22px;font-size:13px;color:var(--on-desk-soft);max-width:60ch}

/* ---------- top bar ---------- */
.bar{display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap;margin-bottom:20px}
.bar .grow{flex:1}
.roomchip{display:flex;align-items:center;gap:10px;background:var(--desk-deep);border:2px solid var(--desk-edge);border-radius:10px;padding:6px 8px 6px 12px}
.roomchip .lbl{color:var(--on-desk-soft)}
.roomchip strong{font:700 20px/1 var(--font-mono);letter-spacing:.18em;color:var(--accent)}

/* ---------- lobby ---------- */
.lobby-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:start}
.side{display:grid;gap:22px;min-width:0}
.tape-card .intro{color:var(--ink-soft);font-size:14px;margin:4px 0 14px}
.addrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.addrow .msg{flex:1;min-width:160px}
details.help{margin-top:12px;border:2px dashed var(--rule);border-radius:8px;padding:10px 12px;font-size:14px}
details.help summary{cursor:pointer;font-weight:700}
details.help ul{margin:8px 0 0;padding-left:18px;display:grid;gap:6px;color:var(--ink-soft)}
details.help b{color:var(--ink)}
kbd{font:600 12px/1 var(--font-mono);background:var(--paper-shade);border:1px solid var(--ink-soft);border-bottom-width:2px;border-radius:4px;padding:2px 5px;color:var(--ink)}
.songs{list-style:none;margin:16px 0 0;padding:0;border-top:2px solid var(--ink)}
.song{display:grid;grid-template-columns:28px 36px minmax(0,1fr);gap:10px;align-items:center;min-height:46px;padding:5px 0;border-bottom:1px solid var(--rule)}
.song .num{font:500 12px/1 var(--font-mono);color:var(--ink-soft);text-align:right}
.song img,.song .ph{width:36px;height:36px;border-radius:4px;object-fit:cover;background:var(--paper-shade)}
.song .stitle{font-family:var(--font-hand);font-weight:700;font-size:17px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.song.loading .stitle{color:var(--ink-soft);font-weight:400}
.song.bad .stitle{color:var(--bad);font-family:var(--font-body);font-size:14px}
.song .x{width:32px;height:32px;border-radius:6px;border:0;background:transparent;color:var(--ink-soft);font-size:22px;line-height:1;cursor:pointer}
.song .x:hover{background:var(--paper-shade);color:var(--ink)}
.empty-songs{padding:22px 4px 8px;color:var(--ink-soft);font-family:var(--font-hand);font-size:18px}
.tape-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:10px;flex-wrap:wrap}

.plist{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px}
.prow{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 12px;border-radius:8px;background:var(--field);border:2px solid var(--paper-shade);border-left:8px solid var(--c)}
.prow .dot{display:none}
.prow .pname{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;grid-column:1 / 3}
.prow .pname em{font-style:normal;font-weight:500;color:var(--ink-soft)}
.prow .pmeta{grid-column:1 / 3;font-size:13px;color:var(--ink-soft)}
.prow .pready{grid-row:1 / 3;grid-column:3;font:700 11px/1 var(--font-body);letter-spacing:.08em;text-transform:uppercase;padding:6px 8px;border-radius:999px;background:var(--paper-shade);color:var(--ink-soft)}
.prow .pready.yes{background:var(--ok);color:var(--paper)}
.prow.off{opacity:.5}
.readyrow{display:flex;align-items:center;gap:10px;margin-top:14px;font-weight:700;cursor:pointer}
.readyrow input{width:22px;height:22px;accent-color:var(--ok)}
.settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:14px 0}
#start-why{font-size:14px;color:var(--ink-soft);margin-bottom:12px}
.rules{font-size:14px;color:var(--on-desk-soft)}
.rules summary{cursor:pointer;color:var(--on-desk);font-weight:700}
.rules ul{margin:10px 0 0;padding-left:18px;display:grid;gap:6px}
.pts{font:700 13px/1 var(--font-mono);color:var(--accent)}

/* ---------- game ---------- */
.sidelabel{font:700 13px/1 var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--on-desk)}
.sidelabel small{display:block;margin-top:6px;font-size:11px;color:var(--on-desk-soft);letter-spacing:.08em}
.counter{display:flex;gap:3px;padding:5px;background:var(--shell);border:2px solid var(--desk-edge);border-radius:8px}
.counter span{display:block;width:26px;padding:6px 0;text-align:center;font:700 20px/1 var(--font-mono);font-variant-numeric:tabular-nums;color:var(--ink);background:var(--paper);border-radius:3px}
.counter.low span{background:var(--bad);color:var(--paper)}
.counter.idle span{color:var(--ink-soft)}
.timebar{height:6px;border-radius:3px;background:var(--desk-deep);overflow:hidden;margin:-6px 0 20px}
.timebar i{display:block;height:100%;width:100%;background:var(--accent);transform-origin:left;transition:transform .2s linear}

.game-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
.deck{display:grid;gap:14px;min-width:0}
.cassette{background:var(--shell);border:3px solid var(--desk-edge);border-radius:16px;padding:14px;box-shadow:0 14px 34px rgba(4,7,40,.45)}
.cass-label{position:relative;background:var(--paper);color:var(--ink);border-radius:6px;padding:12px 14px 14px;
  background-image:linear-gradient(to bottom,var(--c,var(--accent)) 0 6px,transparent 6px 8px,var(--c,var(--accent)) 8px 12px,transparent 12px),repeating-linear-gradient(to bottom,transparent 0 29px,var(--rule) 29px 30px);
  background-position:0 0,0 14px;padding-top:24px;min-height:0}
.cass-label .side{position:absolute;top:22px;right:12px;font:400 30px/1 var(--font-display);color:var(--ink)}
.cass-meta{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:center;padding-right:34px}
.cass-meta img,.cass-meta .ph{width:64px;height:64px;border-radius:4px;object-fit:cover;background:var(--paper-shade);border:2px solid var(--ink)}
#track-title{font-family:var(--font-hand);font-weight:700;font-size:clamp(22px,3vw,28px);line-height:1.15;overflow-wrap:anywhere}
.cass-of{font:500 12px/1 var(--font-mono);color:var(--ink-soft);margin-top:8px}
.cass-window{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px auto 0;max-width:240px;height:50px;background:var(--desk-deep);border:3px solid var(--desk-edge);border-radius:31px;padding:0 10px}
.cass-window .band{flex:1;height:16px;border-radius:8px;background:linear-gradient(to bottom,#2a1d12,#4a3220 50%,#2a1d12)}
.reel{width:36px;height:36px;flex:none}
.spinning .reel{animation:spin 1.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cass-foot{display:none;height:28px;margin:12px 48px 0;border:3px solid var(--desk-edge);border-bottom:0;border-radius:10px 10px 0 0}
.player-box{background:var(--desk-deep);border:2px solid var(--desk-edge);border-radius:var(--radius);padding:12px}
#sp-slot{min-height:80px;border-radius:12px;overflow:hidden}
#sp-slot iframe{display:block;border-radius:12px}
.sp-status{font-size:13px;color:var(--on-desk-soft);margin-top:8px}
.toggle{display:grid;grid-template-columns:20px minmax(0,1fr);gap:2px 10px;align-items:center;font-size:14px;color:var(--on-desk);cursor:pointer}
.toggle input{width:20px;height:20px;margin:0;accent-color:var(--accent)}
.toggle small{grid-column:2;font-size:13px;color:var(--on-desk-soft)}

.play-card h2{font-family:var(--font-display);font-weight:400;font-size:clamp(26px,3.4vw,34px);line-height:1}
.play-card .sub{color:var(--ink-soft);margin:8px 0 16px}
.note{background:var(--accent);color:var(--ink);border:2px solid var(--ink);border-radius:8px;padding:10px 12px;font-weight:700;margin-bottom:14px}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.pick{display:flex;align-items:center;gap:10px;text-align:left;padding:13px 12px;border-radius:8px;border:2px solid var(--ink);border-left:10px solid var(--c);background:var(--field);color:var(--ink);font-weight:700;cursor:pointer;min-width:0}
.pick span.n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick .ck{width:22px;height:22px;border-radius:50%;border:2px solid var(--ink-soft);display:grid;place-items:center;font-size:13px;color:transparent;flex:none}
.pick[aria-pressed=true]{background:color-mix(in srgb,var(--c) 38%,var(--field));box-shadow:0 3px 0 var(--ink)}
.pick[aria-pressed=true] .ck{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.pick:disabled{cursor:default}
.pick.off{opacity:.55}
.vote-status{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:14px;font-size:14px;color:var(--ink-soft)}
.vchip{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;background:var(--paper-shade);font-size:13px;font-weight:700;color:var(--ink-soft)}
.vchip.done{background:var(--ink);color:var(--paper)}
.vchip .dot{width:9px;height:9px;border-width:1px}
.hostrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}

.owners{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 18px}
.owner{display:inline-flex;align-items:center;gap:10px;padding:10px 16px 10px 12px;border-radius:10px;border:2px solid var(--ink);background:color-mix(in srgb,var(--c) 45%,var(--field));font:400 22px/1 var(--font-display);color:var(--ink);box-shadow:0 3px 0 var(--ink)}
.owner .dot{width:16px;height:16px}
.rrows{list-style:none;margin:0;padding:0;border-top:2px solid var(--ink)}
.rrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--rule)}
.rrow .who{display:flex;align-items:center;gap:8px;font-weight:700;min-width:0}
.rrow .who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .delta{grid-row:1 / 3;grid-column:2;align-self:center;font:700 18px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.rrow .delta.pos{color:var(--ok)}
.rrow .delta.zero{color:var(--ink-soft)}
.rrow .detail{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--ink-soft)}
.gchip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;font-weight:700;font-size:12px;border:1.5px solid currentColor}
.gchip.hit{color:var(--ok)}
.gchip.miss{color:var(--bad)}
.badge{font:700 11px/1 var(--font-body);letter-spacing:.06em;text-transform:uppercase;padding:4px 7px;border-radius:4px;background:var(--ink);color:var(--paper)}
.badge.gold{background:var(--accent);color:var(--ink);border:1.5px solid var(--ink)}
.board{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.board li{display:grid;grid-template-columns:26px 12px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;background:var(--field);border:1px solid var(--paper-shade)}
.board .rk{font:700 13px/1 var(--font-mono);color:var(--ink-soft);text-align:right}
.board .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .sc{font:700 15px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.board li.me{border:2px solid var(--ink)}
.reveal-h3{margin-top:22px;font:700 12px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
#next-wait,#again-wait{margin-top:12px;font-size:14px;color:var(--ink-soft)}

/* ---------- end ---------- */
.end-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:start}
.end-title{font-family:var(--font-display);font-weight:400;font-size:clamp(44px,8vw,88px);line-height:.92;color:var(--paper);margin:8px 0 22px}
.end-title span{display:block;color:var(--accent)}
.podium{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.podium li{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;border-radius:10px;background:var(--field);border:2px solid var(--paper-shade);border-left:10px solid var(--c)}
.podium .pos{font:400 26px/1 var(--font-display);color:var(--ink-soft)}
.podium li:first-child{border-color:var(--ink);border-left-color:var(--c);box-shadow:0 3px 0 var(--ink)}
.podium li:first-child .pos{color:var(--ink)}
.podium .nm{font-weight:700;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.podium .sc{font:700 20px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.awards{display:grid;gap:14px}
.award .lbl{display:block;margin-bottom:6px}
.award p{font-family:var(--font-hand);font-weight:700;font-size:22px;line-height:1.2}
.award small{display:block;font-size:14px;color:var(--ink-soft);margin-top:4px}
.end-actions{display:grid;gap:10px;margin-top:18px}

/* ---------- banner & toast ---------- */
.banner{position:fixed;left:0;right:0;top:0;z-index:30;background:var(--bad);color:var(--paper);
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;font-weight:700}

    if (j && j.items) top = top.concat(j.items);

  shuffle(uniqTracks(top)).slice(0, SRC_LIMIT.top).forEach((tr) => add(tr, 'top'));

  // Liked songs: the newest page plus two random pages further back.
  const liked = await api('/me/tracks?limit=50');
  if (liked && liked.items && liked.items.length) {
    let pool = liked.items;
    const pages = Math.ceil((liked.total || 0) / 50);
    for (const p of shuffle([...Array(pages).keys()].slice(1)).slice(0, 2)) {
      const j = await api(`/me/tracks?limit=50&offset=${p * 50}`);
      if (j && j.items) pool = pool.concat(j.items);
    }
    shuffle(uniqTracks(pool.map((x) => x && (x.track || x.item)))).slice(0, SRC_LIMIT.liked).forEach((tr) => add(tr, 'liked'));
  }

  // Playlists the player made (Spotify only returns the songs of playlists you own).
  const me = await api('/me');
  const lists = await api('/me/playlists?limit=50');
  if (me && lists && lists.items) {
    const mine = lists.items.filter((pl) => pl && pl.id && ((pl.owner && pl.owner.id === me.id) || pl.collaborative));
    let pool = [];
    for (const pl of shuffle(mine).slice(0, 6)) {
      const total = ((pl.items && !Array.isArray(pl.items) ? pl.items : pl.tracks) || {}).total || 0;
      if (!total) continue;
      const j = await api(`/playlists/${pl.id}/items?limit=50&offset=${total > 50 ? randInt(total - 49) : 0}`);
      if (j && j.items) pool = pool.concat(j.items.map((x) => x && (x.item || x.track)));
    }
    shuffle(uniqTracks(pool)).slice(0, SRC_LIMIT.playlists).forEach((tr) => add(tr, 'playlists'));
  }

  // Saved albums: a few tracks from random albums.
  const albums = await api('/me/albums?limit=50');
  if (albums && albums.items && albums.items.length) {
    let list = albums.items;
    if ((albums.total || 0) > 50) {
      const j = await api(`/me/albums?limit=50&offset=${randInt(albums.total - 49)}`);
      if (j && j.items) list = list.concat(j.items);
    }
    const pool = [];
    for (const x of shuffle(list).slice(0, 12)) {
      const album = x && x.album;
      if (!album || !album.tracks || !Array.isArray(album.tracks.items)) continue;
      for (const tr of shuffle(album.tracks.items).slice(0, 3)) pool.push({ tr, images: album.images });
    }
    shuffle(pool).slice(0, SRC_LIMIT.albums).forEach(({ tr, images }) => add(tr, 'albums', images));
  }
  return shuffle([...songs.values()]).slice(0, MAX_SONGS);
}

// Callback mode: this page was opened by Spotify's redirect in the sign-in tab.
async function runSpotifyCallback(params) {
  const auth = ls.get('wt-sp-auth', null);
  if (auth && auth.lang) LANG = auth.lang === 'pt' ? 'pt' : 'en';
  applyStatic(); show('spotify');
  const status = (key, isErr) => { const el = $('#cb-text'); el.textContent = t(key); el.classList.toggle('err', !!isErr); };
  const send = (payload) => {
    try { const bc = spChannel(); if (bc) bc.postMessage(payload); } catch (e) { /* ignore */ }
    try { localStorage.setItem('wt-sp-result', JSON.stringify(payload)); } catch (e) { /* ignore */ }
    try { localStorage.removeItem('wt-sp-auth'); } catch (e) { /* ignore */ }
    try { history.replaceState(null, '', spRedirectUri()); } catch (e) { /* ignore */ }
    $('#cb-close').hidden = false;
  };
  const fail = (code) => { status('spc.err.' + code, true); send({ type: 'wt-spotify', state: params.get('state'), error: code }); };
  if (params.get('error')) { fail(params.get('error') === 'access_denied' ? 'denied' : 'failed'); return; }
  if (!auth || auth.state !== params.get('state') || Date.now() - auth.ts > 15 * 60 * 1000) { fail('expired'); return; }
  status('cb.loading');
  try {
    const tok = await fetch('https://accounts.spotify.com/api/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({ grant_type: 'authorization_code', code: params.get('code') || '', redirect_uri: auth.redirect, client_id: SPOTIFY_CLIENT_ID, code_verifier: auth.verifier }),
    });
    if (!tok.ok) { fail(tok.status === 403 ? 'notListed' : 'failed'); return; }
    const token = (await tok.json()).access_token;
    const tracks = await pullLibrary(token);
    if (!tracks.length) { fail('empty'); return; }
    status('cb.done');
    send({ type: 'wt-spotify', state: auth.state, tracks });
    setTimeout(() => { try { window.close(); } catch (e) { /* user closes it */ } }, 1200);
  } catch (e) { fail(e && e.message === 'notListed' ? 'notListed' : 'failed'); }
}

/* ============ networking ============ */
let peer = null;
let hostConn = null;

function netError(err) {
  const type = (err && err.type) || 'error';
  if (type === 'browser-incompatible') return () => t('err.browser');
  if (['network', 'server-error', 'socket-error', 'socket-closed'].includes(type)) return () => t('err.network');
  return () => t('err.generic', { type });
}
function makeCode() { let c = ''; for (let i = 0; i < 5; i++) c += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]; return c; }
function readName() {
  const n = cleanName($('#name-input').value);

  S.name = n; ls.set('wt-name', n); return n;
}
function setHomeBusy(busy) { $('#create-btn').disabled = busy; $('#join-btn').disabled = busy; }

function createRoom() {
  if (typeof Peer === 'undefined') { setMsg('home', 'err.noPeer', null, true); return; }
  if (!readName()) return;
  setHomeBusy(true); setMsg('home', 'home.creating');
  const attempt = (n) => {
    const code = makeCode();
    const p = new Peer(PREFIX + code.toLowerCase(), { debug: 1 });
    let opened = false;
    p.on('open', () => { opened = true; peer = p; S.role = 'host'; S.code = code; keepAlive(p); H.init(code, S.name); setHomeBusy(false); setMsg('home', null); setUrl(code); });
    p.on('connection', (conn) => H.accept(conn));
    p.on('error', (err) => {
      if (opened) { console.warn('peer', err); return; }
      p.destroy();
      if (err.type === 'unavailable-id' && n < 4) { attempt(n + 1); return; }
      setHomeBusy(false); setMsg('home', netError(err), null, true);
    });
  };
  attempt(0);
}

function joinRoom(code, quiet) {
  if (typeof Peer === 'undefined') { setMsg('home', 'err.noPeer', null, true); return; }
  if (!quiet && !readName()) return;
  code = String(code || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (code.length !== 5) { setMsg('home', 'err.codeLen', null, true); return; }
  if (peer && !peer.destroyed) peer.destroy();
  S.role = 'guest'; S.code = code;
  setHomeBusy(true); if (!quiet) setMsg('home', 'home.joining', { code });
  const p = new Peer({ debug: 1 }); peer = p;
  p.on('open', () => { keepAlive(p); connectToHost(); });
  p.on('error', (err) => {
    if (p !== peer) return;
    if (err.type === 'peer-unavailable') { failJoin(() => t('err.notFound', { code })); return; }
    if (!hostConn || !hostConn.open) failJoin(netError(err));
  });
}
function failJoin(textFn) {
  setHomeBusy(false);
  if (S.pub) { showBanner(textFn, [{ key: 'ban.retry', fn: () => { hideBanner(); joinRoom(S.code, true); } }, { key: 'ban.leave', fn: leave }]); return; }
  try { peer && peer.destroy(); } catch (e) { /* ignore */ }
  peer = null; S.role = null;
  show('home'); setMsg('home', textFn, null, true);
}
function connectToHost() {
  const conn = peer.connect(PREFIX + S.code.toLowerCase(), { reliable: true });
  hostConn = conn;
  const timer = setTimeout(() => { if (hostConn === conn && !conn.open) failJoin(() => t('err.noAnswer')); }, 15000);
  conn.on('open', () => {
    clearTimeout(timer); hideBanner(); setHomeBusy(false); setMsg('home', null);
    conn.send({ t: 'hello', pid: myPid, name: S.name, songs: sendableSongs() });
    setUrl(S.code);
  });
  conn.on('data', (msg) => {
    if (!msg || typeof msg !== 'object') return;
    if (msg.t === 'state') onState(msg);
    else if (msg.t === 'error') failJoin(msg.code === 'full' ? () => t('err.full', { n: msg.max || MAX_PLAYERS }) : () => t('err.refused'));
  });

}
function onHostLost() {
  if (!S.pub) return;
  showBanner(() => t('ban.lost'), [
    { key: 'ban.reconnect', fn: () => { hideBanner(); if (peer && !peer.destroyed && peer.open) connectToHost(); else joinRoom(S.code, true); } },
    { key: 'ban.leave', fn: leave },
  ]);
}
function sendHost(msg) {
  if (S.role === 'host') H.handle(myPid, msg);
  else if (hostConn && hostConn.open) { try { hostConn.send(msg); } catch (e) { /* dropped */ } }
}
function setUrl(code) {
  try { const u = new URL(location.href); u.searchParams.set('sala', code); history.replaceState(null, '', u); } catch (e) { /* ignore */ }
}
function inviteLink() { const u = new URL(location.href); u.search = ''; u.hash = ''; u.searchParams.set('sala', S.code); return u.toString(); }
function leave() {
  try { hostConn && hostConn.close(); } catch (e) { /* ignore */ }
  try { peer && peer.destroy(); } catch (e) { /* ignore */ }
  peer = null; hostConn = null; S.role = null; S.pub = null; S.code = null; S.deadline = 0;
  H.stop(); H = makeHost();
  spStop(); hideBanner(); setHomeBusy(false); setMsg('home', null);
  try { const u = new URL(location.href); u.search = ''; history.replaceState(null, '', u); } catch (e) { /* ignore */ }
  show('home');
}

/* ============ host engine (runs only in the host's browser) ============ */

    stateFor(pid) {

        id: p.id, name: p.name, color: p.color, songs: p.songs.length, connected: p.connected, score: p.score, host: p.id === this.hostPid,
      }));

  applyStatic(); paintMsg('home'); paintMsg('spc'); paintBanner(); renderMySongs(); renderSpotifySetup();
  if (S.pub) render(S.pub); // prev === current: repaint only, no round reset
  $('#sp-status').textContent = t(SP.api || SP.ctrl ? 'sp.hint' : 'sp.loading');
}
function renderSpotifySetup() {
  const on = spotifyOn();
  $('#sp-connect').hidden = !on;
  $('#sp-notsetup').hidden = on;
}

function renderLobby(prev) {
  const st = S.pub; const isHost = S.role === 'host';
  if (!prev || prev.phase !== 'lobby') renderMySongs();
  $('#room-code').textContent = st.code;
  $('#pcount').textContent = st.players.length + '/' + MAX_PLAYERS;
  $('#player-list').replaceChildren(...st.players.map((p) => {
    const li = document.createElement('li');
    const ready = p.songs > 0;
    li.className = 'prow' + (p.connected ? '' : ' off'); li.style.setProperty('--c', p.color);
    li.innerHTML = `<span class="dot"></span><span class="pname"></span><span class="pmeta"></span><span class="pready${ready ? ' yes' : ''}"></span>`;
    const nm = li.querySelector('.pname'); nm.textContent = p.name;
    if (p.id === myPid) { const em = document.createElement('em'); em.textContent = ' ' + t('room.you'); nm.append(em); }
    if (p.host) { const tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = t('room.host'); nm.append(' ', tag); }
    li.querySelector('.pmeta').textContent = ready ? t('songs', { n: p.songs }) : '';
    li.querySelector('.pready').textContent = t(ready ? 'room.ready' : 'room.waiting');
    return li;
  }));
  $('#set-target').value = String(st.settings.target);
  $('#set-secs').value = String(st.settings.seconds);
  $('#set-explicit').value = st.settings.explicit ? '1' : '0';
  $('#set-start').value = st.settings.start;
  $$('#set-sources input').forEach((c) => { c.checked = !!st.settings.sources[c.dataset.src]; c.disabled = !isHost; });
  ['#set-target', '#set-secs', '#set-explicit', '#set-start'].forEach((id) => { $(id).disabled = !isHost; });
  $('#start-btn').hidden = !isHost;
  const cs = st.canStart || { ok: false, why: 'start.needPlayer' };
  $('#start-btn').disabled = !cs.ok;
  let why = '';
  if (!isHost) why = t('match.guest');
  else if (!cs.ok) why = t(cs.why);
  else why = (cs.notReady ? t('start.notReady', { n: cs.notReady }) : t('start.allReady')) + t('start.goal', { n: st.settings.target });
  $('#start-why').textContent = why;
}

function playerById(id) { return S.pub.players.find((p) => p.id === id); }
function displayName(p) { return p.id === myPid ? p.name + ' ' + t('room.you') : p.name; }

function renderGame(prev) {
  const st = S.pub; const r = st.round; const isHost = S.role === 'host';
  const newRound = !prev || !prev.round || prev.round.n !== r.n || prev.phase === 'lobby' || prev.phase === 'end';
  if (newRound) {
    S.picks = new Set(r.myVote || []); S.locked = !!r.myVote;
    if (S.playHere) spLoad(r.trackId);
  }
  if (r.myVote && !S.locked) { S.locked = true; S.picks = new Set(r.myVote); }

  // A cassette side holds 10 tracks, then the tape flips.
  const side = Math.floor((r.n - 1) / 10) % 2 ? 'B' : 'A';
  $('#side-text').textContent = t('game.track', { side, no: pad2(((r.n - 1) % 10) + 1) });
  $('#round-of').textContent = t('game.goal', { n: st.settings.target });
  $('#cass-side').textContent = side;
  $('#cass-of').textContent = t('game.trackNo', { n: r.n });
  $('#track-title').textContent = r.title || t('game.mystery');
  const img = $('#track-thumb');
  if (r.thumb) { if (img.getAttribute('src') !== r.thumb) img.src = r.thumb; img.hidden = false; $('#track-ph').hidden = true; }
  else { img.hidden = true; $('#track-ph').hidden = false; }
  $('#play-here').checked = S.playHere;
  $('.player-box').hidden = !S.playHere;

  const inRound = st.phase === 'round';
  $('#round-panel').hidden = !inRound;
  $('#reveal-panel').hidden = inRound;
  $('#cass-label').style.setProperty('--c', inRound ? 'var(--accent)' : (playerById((st.reveal.owners || [])[0]) || {}).color || 'var(--accent)');
  if (inRound) renderRoundPanel(); else renderReveal();
  $('#board-h').textContent = t('rev.board', { n: st.settings.target });
  renderBoard($('#board'));
  $('#host-round').hidden = !(isHost && inRound);
  reels();
}

function renderRoundPanel() {
  const st = S.pub; const r = st.round;
  const focused = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.pid : null;
  $('#pick-grid').replaceChildren(...st.players.map((p) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'pick' + (p.connected ? '' : ' off'); b.dataset.pid = p.id;
    b.style.setProperty('--c', p.color);
    b.setAttribute('aria-pressed', S.picks.has(p.id) ? 'true' : 'false');
    b.disabled = S.locked;
    b.innerHTML = '<span class="n"></span><span class="ck" aria-hidden="true">✓</span>';
    b.querySelector('.n').textContent = displayName(p);
    return b;
  }));
  if (focused) { const f = $(`.pick[data-pid="${CSS.escape(focused)}"]`); if (f && !f.disabled) f.focus(); }
  const lock = $('#lock-btn');
  lock.disabled = S.locked || S.picks.size === 0;
  lock.textContent = t(S.locked ? 'game.locked' : 'game.lock');
  const live = st.players.filter((p) => p.connected);
  const voted = new Set(r.voted);
  const vs = $('#vote-status');
  vs.replaceChildren();
  const label = document.createElement('span');
  label.textContent = t('game.voted', { n: live.filter((p) => voted.has(p.id)).length, m: live.length });
  vs.append(label);
  for (const p of live) {
    const c = document.createElement('span'); c.className = 'vchip' + (voted.has(p.id) ? ' done' : ''); c.style.setProperty('--c', p.color);
    c.innerHTML = '<span class="dot"></span><span></span>'; c.lastChild.textContent = p.id === myPid ? t('game.youChip') : p.name;
    vs.append(c);
  }
}

function renderReveal() {
  const st = S.pub; const rv = st.reveal; const r = st.round; const isHost = S.role === 'host';
  const owners = rv.owners.map(playerById).filter(Boolean);
  $('#reveal-title').textContent = t(owners.length > 1 ? 'rev.multi' : 'rev.single');
  $('#owners').replaceChildren(...owners.map((p) => {
    const o = document.createElement('span'); o.className = 'owner'; o.style.setProperty('--c', p.color);
    o.innerHTML = '<span class="dot"></span><span></span>'; o.lastChild.textContent = displayName(p);
    return o;
  }));
  const ownerSet = new Set(rv.owners);
  $('#reveal-rows').replaceChildren(...rv.rows.map((row) => {
    const p = playerById(row.id); if (!p) return document.createComment('');
    const li = document.createElement('li'); li.className = 'rrow';
    li.innerHTML = `<div class="who"><span class="dot" style="--c:${esc(p.color)}"></span><span></span></div><div class="delta ${row.delta > 0 ? 'pos' : 'zero'}">${row.delta > 0 ? '+' : ''}${row.delta}</div><div class="detail"></div>`;
    li.querySelector('.who span:last-child').textContent = displayName(p);
    const d = li.querySelector('.detail');
    const add = (cls, text) => { const s = document.createElement('span'); if (cls) s.className = cls; s.textContent = text; d.append(s); };
    if (row.owner) add('badge', t('rev.had'));
    if (!row.voted) add('', t('rev.noGuess'));
    else if (!row.picks.length) add('', t('rev.nobody'));
    for (const id of row.picks) {
      const q = playerById(id); if (!q) continue;
      const hit = ownerSet.has(id);
      add('gchip ' + (hit ? 'hit' : 'miss'), (hit ? '✓ ' : '✗ ') + q.name);
    }
    if (row.exact) add('badge gold', t('rev.exact'));
    if (row.fooled) add('', t('rev.fooled', { n: row.fooled }));
    return li;
  }));
  $('#next-btn').hidden = !isHost;
  $('#next-btn').textContent = t(r.last ? 'rev.final' : 'rev.next');
  $('#next-wait').textContent = isHost ? '' : t(r.last ? (r.win ? 'rev.waitLast' : 'rev.waitOut') : 'rev.wait');
}

function renderBoard(ol) {
  const target = S.pub.settings.target;
  const ps = [...S.pub.players].sort((a, b) => b.score - a.score);
  ol.replaceChildren(...ps.map((p, i) => {
    const li = document.createElement('li'); if (p.id === myPid) li.className = 'me';
    li.style.setProperty('--c', p.color);
    li.style.setProperty('--fill', Math.min(100, Math.round((p.score / target) * 100)) + '%');
    li.innerHTML = `<span class="rk">${i + 1}</span><span class="dot"></span><span class="nm"></span><span class="sc">${p.score}</span>`;
    li.querySelector('.nm').textContent = p.name;
    return li;
  }));
}

function renderEnd() {
  const st = S.pub; const isHost = S.role === 'host';
  const ps = [...st.players].sort((a, b) => b.score - a.score);
  $('#podium').replaceChildren(...ps.map((p, i) => {
    const li = document.createElement('li'); li.style.setProperty('--c', p.color);
    li.innerHTML = `<span class="pos">${i + 1}</span><span class="nm"></span><span class="sc">${p.score}</span>`;
    li.querySelector('.nm').textContent = displayName(p);
    return li;
  }));
  const names = (ids) => ids.map((id) => (playerById(id) || {}).name).filter(Boolean).join(t('aw.and'));
  const awards = [];
  const e = st.end || {};
  if (e.detective) awards.push({ lbl: t('aw.det'), who: names(e.detective.ids), why: t('aw.detWhy', { n: e.detective.n }) });
  if (e.poker) awards.push({ lbl: t('aw.poker'), who: names(e.poker.ids), why: t('aw.pokerWhy', { n: e.poker.n }) });
  if (e.stranger) awards.push({ lbl: t('aw.self'), who: names(e.stranger.ids), why: t('aw.selfWhy', { n: e.stranger.n }) });
  if (e.twins) awards.push({ lbl: t('aw.twins'), who: names(e.twins.ids), why: t('aw.twinsWhy', { n: e.twins.n }) });
  $('#awards').replaceChildren(...awards.map((a) => {
    const c = document.createElement('section'); c.className = 'card award';
    c.innerHTML = '<span class="lbl"></span><p></p><small></small>';
    c.querySelector('.lbl').textContent = a.lbl; c.querySelector('p').textContent = a.who; c.querySelector('small').textContent = a.why;
    return c;
  }));
  $('#again-btn').hidden = !isHost;
  $('#again-wait').textContent = isHost ? '' : t('end.againWait');
}

/* ============ timer ============ */
function tick() {
  const st = S.pub; const c = $('#counter'); if (!c) return;
  let txt = '---', frac = 1, low = false, idle = true;
  if (st && st.phase === 'round' && S.deadline) {
    const rem = Math.max(0, S.deadline - performance.now());
    const secs = Math.ceil(rem / 1000);
    txt = String(Math.min(999, secs)).padStart(3, '0');
    frac = st.settings.seconds ? rem / (st.settings.seconds * 1000) : 1;
    low = secs <= 5; idle = false;
  }
  const spans = c.children;
  for (let i = 0; i < 3; i++) if (spans[i].textContent !== txt[i]) spans[i].textContent = txt[i];
  c.classList.toggle('low', low); c.classList.toggle('idle', idle);
  $('#timebar-fill').style.transform = `scaleX(${Math.max(0, Math.min(1, frac))})`;
}
setInterval(tick, 200);

/* ============ Spotify player ============ */
const SP = { api: null, ctrl: null, creating: false, current: null, want: null, playOnReady: false, playing: false, seekPending: false, seekTo: null, seekTries: 0, fullMs: 60000 };
window.onSpotifyIframeApiReady = (api) => { SP.api = api; if (SP.want && S.playHere) spLoad(SP.want); };
function spLoad(id) {
  SP.want = id;
  if (!SP.api) { $('#sp-status').textContent = t('sp.loading'); return; }
  const uri = 'spotify:track:' + id;
  if (!SP.ctrl) {
    if (SP.creating) return;
    SP.creating = true;
    const el = document.createElement('div');
    $('#sp-slot').replaceChildren(el);
    SP.api.createController(el, { uri, width: '100%', height: 80 }, (ctrl) => {
      SP.ctrl = ctrl; SP.creating = false; SP.current = id; SP.playOnReady = true; SP.seekPending = true;
      ctrl.addListener('ready', () => { if (SP.playOnReady) { SP.playOnReady = false; try { ctrl.play(); } catch (e) { /* user can press play */ } } });
      ctrl.addListener('playback_update', (ev) => {
        const d = (ev && ev.data) || {};
        SP.playing = !d.isPaused; reels();
        // Right after a new song is loaded the embed can still report the previous one.
        if (d.playingURI && d.playingURI !== 'spotify:track:' + SP.current) return;
        if (d.isPaused || d.isBuffering || !(d.duration > 0)) return;
        const pos = (d.position || 0) / 1000;
        if (SP.seekPending) {
          SP.seekPending = false;
          const middle = S.pub && S.pub.settings && S.pub.settings.start === 'middle';
          // 30-second previews (no Spotify login in this browser) can't be moved past their end.
          if (middle && d.duration > SP.fullMs && pos < 15) { SP.seekTo = Math.round((d.duration * 0.4) / 1000); SP.seekTries = 0; try { ctrl.seek(SP.seekTo); } catch (e) { /* ignore */ } }
        } else if (SP.seekTo != null) {
          if (pos >= SP.seekTo - 3) SP.seekTo = null; // landed
          else if (++SP.seekTries <= 3) { try { ctrl.seek(SP.seekTo); } catch (e) { /* ignore */ } }
          else SP.seekTo = null;
        }
      });
      $('#sp-status').textContent = t('sp.hint');
      if (SP.want !== id) spLoad(SP.want);
    });
  } else if (SP.current !== id) {
    SP.current = id; SP.playOnReady = true; SP.seekPending = true; SP.seekTo = null;
    SP.ctrl.loadUri(uri);
    setTimeout(() => { if (SP.playOnReady && SP.current === id) { SP.playOnReady = false; try { SP.ctrl.play(); } catch (e) { /* ignore */ } } }, 1800);
  } else {
    try { SP.ctrl.play(); } catch (e) { /* ignore */ }
  }
}
function spStop() { if (SP.ctrl) { try { SP.ctrl.pause(); } catch (e) { /* ignore */ } } SP.playing = false; reels(); }
function reels() {
  const st = S.pub;
  const on = st && (st.phase === 'round' || st.phase === 'reveal') && (S.playHere ? SP.playing : st.phase === 'round');
  $('#cassette').classList.toggle('spinning', !!on);
}

/* ============ UI wiring ============ */
$('#name-input').value = S.name;
$('#create-btn').addEventListener('click', createRoom);
$('#join-btn').addEventListener('click', () => joinRoom($('#code-input').value));
$('#code-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') joinRoom($('#code-input').value); });
$('#name-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') { const code = $('#code-input').value.trim(); if (code) joinRoom(code); else createRoom(); } });
$('#code-input').addEventListener('input', (e) => { e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 5); });
document.addEventListener('click', (e) => { const b = e.target.closest('.langsw button'); if (b) setLang(b.dataset.lang); });

$$('.sp-link').forEach((a) => {
  a.addEventListener('click', onSpotifyClick);
  a.addEventListener('auxclick', (e) => { if (e.button === 1) onSpotifyClick(e); });
});
$('#sp-disconnect').addEventListener('click', () => { setTape([]); setMsg('spc', null); });
$('#cb-close-btn').addEventListener('click', () => { try { window.close(); } catch (e) { /* ignore */ } });
const bcIn = spChannel();
if (bcIn) bcIn.addEventListener('message', (e) => onSpotifyResult(e.data));
window.addEventListener('storage', (e) => { if (e.key === 'wt-sp-result' && e.newValue) { try { onSpotifyResult(JSON.parse(e.newValue)); } catch (err) { /* ignore */ } } });

const sendSettings = () => sendHost({
  t: 'settings', target: Number($('#set-target').value), seconds: Number($('#set-secs').value),
  explicit: $('#set-explicit').value === '1', start: $('#set-start').value,
  sources: Object.fromEntries($$('#set-sources input').map((c) => [c.dataset.src, c.checked])),
});
['#set-target', '#set-secs', '#set-explicit', '#set-start'].forEach((id) => $(id).addEventListener('change', sendSettings));
$('#set-sources').addEventListener('change', sendSettings);
$('#start-btn').addEventListener('click', () => sendHost({ t: 'start' }));
$('#copy-link').addEventListener('click', async () => {
  const link = inviteLink();
  try { await navigator.clipboard.writeText(link); toast(t('toast.copied')); }
  catch (e) { toast(t('toast.copyThis', { link })); }
});
$('#leave-lobby').addEventListener('click', leave);
$('#leave-end').addEventListener('click', leave);

$('#pick-grid').addEventListener('click', (e) => {
  const b = e.target.closest('.pick'); if (!b || S.locked) return;
  const id = b.dataset.pid;
  if (S.picks.has(id)) S.picks.delete(id); else S.picks.add(id);
  renderRoundPanel();
});
$('#lock-btn').addEventListener('click', () => {
  const r = S.pub && S.pub.round; if (!r || S.locked || S.pub.phase !== 'round') return;
  S.locked = true;
  sendHost({ t: 'vote', n: r.n, picks: [...S.picks] });
  renderRoundPanel();
});
$('#reveal-now').addEventListener('click', () => sendHost({ t: 'reveal' }));
$('#next-btn').addEventListener('click', () => sendHost({ t: 'next' }));
$('#again-btn').addEventListener('click', () => sendHost({ t: 'lobby' }));
$('#play-here').addEventListener('change', (e) => {
  S.playHere = e.target.checked; ls.set('wt-play', S.playHere);
  $('.player-box').hidden = !S.playHere;
  if (S.playHere && S.pub && S.pub.round) spLoad(S.pub.round.trackId); else spStop();
  reels();
});

window.addEventListener('beforeunload', (e) => {
  if (S.role === 'host' && S.pub && S.pub.players.length > 1) { e.preventDefault(); e.returnValue = ''; }
});

// Boot: translate, then either finish a Spotify sign-in (sign-in tab) or handle an invite link (?sala=CODE).
applyStatic();
$('#sp-status').textContent = t('sp.hint');
renderSpotifySetup();
renderMySongs();
(() => {
  const qp = new URLSearchParams(location.search);
  if (spotifyOn() && qp.has('state') && (qp.has('code') || qp.has('error'))) { runSpotifyCallback(qp); return; }
  if (spotifyOn()) prepareSpotifyLink().catch(() => { $('#sp-connect').hidden = true; $('#sp-notsetup').hidden = false; });
  let code = '';
  try { code = (qp.get('sala') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 5); } catch (e) { /* ignore */ }
  if (code) {
    $('#code-input').value = code;
    setMsg('home', 'home.invited', { code });
    (S.name ? $('#join-btn') : $('#name-input')).focus();
  }
})();
</script>
<script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
</body>
